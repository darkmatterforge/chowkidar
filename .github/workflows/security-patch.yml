name: security-patch

on:
  schedule:
    - cron: "0 6 */2 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  check-and-patch:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      GH_TOKEN: ${{ secrets.PAT_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test ./...

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Install Docker Scout
        run: curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh | sh -s --

      - name: Pull published image
        run: docker pull darkmatterforge/chowkidar:latest

      - name: Check base image freshness
        id: base
        run: |
          PUBLISHED_EPOCH=$(docker inspect darkmatterforge/chowkidar:latest \
            --format '{{.Created}}' | xargs -I{} date -d {} +%s)

          docker pull cgr.dev/chainguard/wolfi-base:latest --quiet

          WOLFI_EPOCH=$(docker inspect cgr.dev/chainguard/wolfi-base:latest \
            --format '{{.Created}}' | xargs -I{} date -d {} +%s)

          UPDATED=false
          REASON=""
          [ "$WOLFI_EPOCH" -gt "$PUBLISHED_EPOCH" ] && UPDATED=true && REASON="wolfi-base updated"

          echo "updated=${UPDATED}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON}" >> "$GITHUB_OUTPUT"
          echo "Base images updated: ${UPDATED} (${REASON:-none})"

      - name: Count fixable CVEs in published image
        id: published_cves
        run: |
          OUTPUT=$(docker scout cves darkmatterforge/chowkidar:latest \
            --only-fixed 2>/dev/null || true)
          COUNT=$(echo "$OUTPUT" | grep -cE "CVE-[0-9]+-[0-9]+" || true)
          LIST=$(echo "$OUTPUT" | grep -oE "CVE-[0-9]+-[0-9]+" | sort -u | paste -sd ',' - || true)
          echo "fixable=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "list=${LIST}" >> "$GITHUB_OUTPUT"
          echo "Published image — unpatched CVEs with a fix available: ${COUNT}"

      - name: Build candidate image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: chowkidar:candidate
          platforms: linux/amd64

      - name: Count fixable CVEs in candidate
        id: candidate_cves
        run: |
          OUTPUT=$(docker scout cves chowkidar:candidate \
            --only-fixed 2>/dev/null || true)
          COUNT=$(echo "$OUTPUT" | grep -cE "CVE-[0-9]+-[0-9]+" || true)
          LIST=$(echo "$OUTPUT" | grep -oE "CVE-[0-9]+-[0-9]+" | sort -u | paste -sd ',' - || true)
          echo "fixable=${COUNT}" >> "$GITHUB_OUTPUT"
          echo "list=${LIST}" >> "$GITHUB_OUTPUT"
          echo "Candidate image — unpatched CVEs with a fix available: ${COUNT}"

      - name: Detect package version changes
        id: packages
        run: |
          docker run --rm darkmatterforge/chowkidar:latest \
            apk info -v 2>/dev/null | sort > /tmp/published-pkgs.txt
          docker run --rm chowkidar:candidate \
            apk info -v 2>/dev/null | sort > /tmp/candidate-pkgs.txt

          # Count only packages that are NEW or UPDATED in candidate (> lines).
          # Each package change produces one < line and one > line, so counting
          # only > gives the real number of changed packages.
          CHANGED=$(diff /tmp/published-pkgs.txt /tmp/candidate-pkgs.txt \
            | grep -cE "^>" || true)
          DIFF_SUMMARY=$(diff /tmp/published-pkgs.txt /tmp/candidate-pkgs.txt \
            | grep -E "^[<>]" | head -20 || true)

          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
          {
            echo "summary<<PKG_EOF"
            echo "$DIFF_SUMMARY"
            echo "PKG_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Packages updated in candidate vs published: ${CHANGED}"

      - name: Decide whether to release
        id: decision
        run: |
          BASE_UPDATED="${{ steps.base.outputs.updated }}"
          BASE_REASON="${{ steps.base.outputs.reason }}"
          PUBLISHED_CVES=${{ steps.published_cves.outputs.fixable }}
          CANDIDATE_CVES=${{ steps.candidate_cves.outputs.fixable }}
          FIXED_CVE_COUNT=$((PUBLISHED_CVES - CANDIDATE_CVES))
          PKG_CHANGES=${{ steps.packages.outputs.changed }}

          SHOULD_RELEASE=false
          REASON_PARTS=""

          if [ "$BASE_UPDATED" = "true" ]; then
            SHOULD_RELEASE=true
            REASON_PARTS="${BASE_REASON}"
          fi
          if [ "$PKG_CHANGES" -gt 0 ]; then
            SHOULD_RELEASE=true
            REASON_PARTS="${REASON_PARTS:+$REASON_PARTS; }${PKG_CHANGES} package(s) updated"
          fi
          if [ "$FIXED_CVE_COUNT" -gt 0 ]; then
            SHOULD_RELEASE=true
            REASON_PARTS="${REASON_PARTS:+$REASON_PARTS; }fixed ${FIXED_CVE_COUNT} CVE(s)"
          fi

          [ "$SHOULD_RELEASE" = "false" ] && echo "No improvements detected — skipping."

          # Compute which CVE IDs were fixed (in published but not in candidate)
          FIXED_CVES=$(comm -23 \
            <(echo "${{ steps.published_cves.outputs.list }}" | tr ',' '\n' | grep -v '^$' | sort) \
            <(echo "${{ steps.candidate_cves.outputs.list }}" | tr ',' '\n' | grep -v '^$' | sort) \
            | paste -sd ',' - || true)

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
          echo "reason=${REASON_PARTS}" >> "$GITHUB_OUTPUT"
          echo "fixed_cves=${FIXED_CVES}" >> "$GITHUB_OUTPUT"
          echo "Release decision: ${SHOULD_RELEASE} — ${REASON_PARTS:-no improvements detected}"
          echo "CVEs eliminated vs published: ${FIXED_CVES:-none}"

      - name: Set up Node.js
        if: steps.decision.outputs.should_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package.json

      - name: Install Playwright dependencies
        if: steps.decision.outputs.should_release == 'true'
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        if: steps.decision.outputs.should_release == 'true'
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Start test containers
        if: steps.decision.outputs.should_release == 'true'
        run: |
          docker run -d --name e2e-target \
            --health-cmd="echo ok" \
            --health-interval=3s \
            --health-timeout=2s \
            --health-retries=1 \
            alpine:3 sh -c "while true; do sleep 5; done"
          docker run -d --name e2e-unhealthy \
            --health-cmd='[ -f /tmp/ok ]' \
            --health-interval=3s \
            --health-timeout=2s \
            --health-retries=1 \
            alpine:3 sh -c 'touch /tmp/ok; sleep 15; rm -f /tmp/ok; while true; do sleep 5; done'

      - name: Start app container
        if: steps.decision.outputs.should_release == 'true'
        run: |
          docker run -d \
            --name chowkidar-e2e \
            -p 18081:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            chowkidar:candidate
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:18081/api/health >/dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "App failed to start"
              docker logs chowkidar-e2e
              exit 1
            fi
          done

      - name: Bootstrap monitoring job for test containers
        if: steps.decision.outputs.should_release == 'true'
        run: |
          curl -s -X POST http://localhost:18081/api/jobs \
            -H 'Content-Type: application/json' \
            -d '{"name":"e2e-monitor","action":"restart","containerNameFilter":"e2e-target,e2e-unhealthy","monitorIntervalSeconds":8,"enabled":true,"startExited":false}'
          sleep 10

      - name: Run E2E tests
        if: steps.decision.outputs.should_release == 'true'
        working-directory: tests/e2e
        run: npx playwright test
        env:
          BASE_URL: http://localhost:18081
          E2E_USERNAME: testadmin
          E2E_PASSWORD: TestPassword1!
          E2E_DISCORD_WEBHOOK_URL: ${{ secrets.E2E_DISCORD_WEBHOOK_URL }}
          E2E_SLACK_WEBHOOK_URL: ${{ secrets.E2E_SLACK_WEBHOOK_URL }}
          E2E_NTFY_TOPIC: ${{ secrets.E2E_NTFY_TOPIC }}
          E2E_TELEGRAM_BOT_TOKEN: ${{ secrets.E2E_TELEGRAM_BOT_TOKEN }}
          E2E_TELEGRAM_CHAT_ID: ${{ secrets.E2E_TELEGRAM_CHAT_ID }}
          E2E_PUSHOVER_USER_KEY: ${{ secrets.E2E_PUSHOVER_USER_KEY }}
          E2E_PUSHOVER_TOKEN: ${{ secrets.E2E_PUSHOVER_TOKEN }}
          E2E_EMAIL_HOST: ${{ secrets.E2E_EMAIL_HOST }}
          E2E_EMAIL_PORT: ${{ secrets.E2E_EMAIL_PORT }}
          E2E_EMAIL_TO: ${{ secrets.E2E_EMAIL_TO }}
          E2E_EMAIL_USERNAME: ${{ secrets.E2E_EMAIL_USERNAME }}
          E2E_EMAIL_PASSWORD: ${{ secrets.E2E_EMAIL_PASSWORD }}

      - name: Stop test containers
        if: always() && steps.decision.outputs.should_release == 'true'
        run: docker rm -f chowkidar-e2e e2e-target e2e-unhealthy || true

      - name: Get next version
        if: steps.decision.outputs.should_release == 'true'
        id: version
        run: |
          LATEST=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          MAJOR=$(echo "$LATEST" | cut -d. -f1 | tr -d v)
          MINOR=$(echo "$LATEST" | cut -d. -f2)
          PATCH=$(echo "$LATEST" | cut -d. -f3)
          NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Current: ${LATEST} → Next: ${NEXT}"

      - name: Create PR
        if: steps.decision.outputs.should_release == 'true'
        id: pr
        run: |
          PR_URL=$(bash scripts/security-patch.sh \
            "${{ steps.version.outputs.next }}" \
            "${{ steps.decision.outputs.reason }}" \
            "${{ steps.packages.outputs.summary }}" \
            "${{ steps.decision.outputs.fixed_cves }}")
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: Merge PR once CI passes
        if: steps.decision.outputs.should_release == 'true'
        run: |
          PR_URL="${{ steps.pr.outputs.url }}"
          HEAD_SHA=$(gh pr view "$PR_URL" --json headRefOid -q .headRefOid)
          echo "Waiting for test-build-smoke on ${HEAD_SHA}..."
          for i in $(seq 1 40); do
            CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}/check-runs" \
              --jq '[.check_runs[] | select(.name == "test-build-smoke")] | first | .conclusion // ""' 2>/dev/null)
            case "$CONCLUSION" in
              success)
                echo "CI passed — merging."
                gh pr merge "$PR_URL" --squash --admin
                exit 0
                ;;
              failure|cancelled|timed_out|action_required)
                echo "CI ended with: $CONCLUSION — aborting."
                exit 1
                ;;
              *)
                echo "Status: ${CONCLUSION:-pending} (${i}/40, next check in 30s)"
                sleep 30
                ;;
            esac
          done
          echo "Timed out after 20 minutes."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
