name: CI

on:
  push:
  pull_request:

# One run per branch/PR at a time. A newer push cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ── 1. Go tests + Docker build ─────────────────────────────────────────────
  # Runs Go unit/integration tests, then builds the image once and exports it
  # as a short-lived artifact so downstream jobs don't need to rebuild.
  test-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Run unit and integration tests
        run: go test ./...

      - name: Build Docker image
        run: docker build -t chowkidar:ci .

      - name: Export image for downstream jobs
        run: docker save chowkidar:ci | gzip > /tmp/chowkidar.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/chowkidar.tar.gz
          retention-days: 1

      - name: API smoke check
        run: bash scripts/api_smoke.sh chowkidar:ci

  # ── 2. Playwright E2E tests ────────────────────────────────────────────────
  # Loads the image built above — no second docker build.
  e2e:
    needs: test-build-smoke
    runs-on: ubuntu-latest
    env:
      APP_PORT: 18081
      BASE_URL: http://localhost:18081

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load Docker image
        run: docker load < /tmp/chowkidar.tar.gz

      - name: Start a monitored test container
        run: docker run -d --name e2e-target --label chowkidar.monitor=true alpine:3 sh -c "while true; do sleep 60; done"

      - name: Start app container
        run: |
          docker run -d \
            --name chowkidar-e2e \
            -p ${{ env.APP_PORT }}:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            chowkidar:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:${{ env.APP_PORT }}/api/health >/dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "App failed to start"
              docker logs chowkidar-e2e
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package.json

      - name: Install dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          BASE_URL: ${{ env.BASE_URL }}
          E2E_USERNAME: testadmin
          E2E_PASSWORD: TestPassword1!

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker rm -f chowkidar-e2e e2e-target || true
