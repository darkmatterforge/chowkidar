name: security-tag

# Fires when the auto-merged security patch PR lands on main.
# Extracts the version from the commit message and pushes the tag,
# which in turn triggers docker-publish and release workflows.
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    if: startsWith(github.event.head_commit.message, 'chore(security): bump to v')
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-tags: true
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Extract version and push tag
        run: |
          MSG="${{ github.event.head_commit.message }}"
          VERSION=$(echo "$MSG" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not extract version from: $MSG"
            exit 1
          fi
          echo "Tagging ${VERSION}"
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "✓ Pushed ${VERSION} — docker-publish and release will trigger."
