name: E2E Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
      APP_PORT: 18081
      BASE_URL: http://localhost:18081

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t chowkidar:e2e .

      - name: Start a monitored test container
        run: docker run -d --name e2e-target --label chowkidar.monitor=true alpine:3 sh -c "while true; do sleep 60; done"

      - name: Start app container
        run: |
          docker run -d \
            --name chowkidar-e2e \
            -p ${{ env.APP_PORT }}:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            chowkidar:e2e
          # Wait for health endpoint
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:${{ env.APP_PORT }}/api/health >/dev/null 2>&1; then
              echo "App is healthy"
              break
            fi
            sleep 1
            if [ "$i" -eq 60 ]; then
              echo "App failed to start"
              docker logs chowkidar-e2e
              exit 1
            fi
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: tests/e2e/package.json

      - name: Install dependencies
        working-directory: tests/e2e
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: tests/e2e
        run: npx playwright test
        env:
          BASE_URL: ${{ env.BASE_URL }}
          E2E_USERNAME: testadmin
          E2E_PASSWORD: TestPassword1!

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 14

      - name: Upload test results (traces/screenshots)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker rm -f chowkidar-e2e e2e-target || true
