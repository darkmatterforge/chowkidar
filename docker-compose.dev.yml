services:
  chowkidar-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: chowkidar-dev
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_PATH: /config
      LOG_LEVEL: debug
      DOCKER_HOST: ${DOCKER_HOST:-}
      CHOWKIDAR_SECRET_KEY: change-me-to-a-long-random-string
    volumes:
      # Source mount: Go files trigger air rebuild; web/ served directly from disk
      - .:/src
      - ./config:/config
      - /var/run/docker.sock:/var/run/docker.sock
      # Cache Go module downloads between restarts
      - chowkidar-dev-gomod:/go/pkg/mod
      - chowkidar-dev-gocache:/root/.cache/go-build

volumes:
  chowkidar-dev-gomod:
  chowkidar-dev-gocache:
